<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/Evangelion.css">
    <link rel="shortcut icon" href="../Imagens/PNG/Evangelion/NERV.ico" type="image/x-icon">
    <title>Soul</title>
</head>
<body>
    <div class="menu"> <!--------------------------------------------Menu--------------------------------------------------------------------------->
        <div id="logo">
            <abbr title="Neon Genesis Evangelion"><img src="../Imagens/PNG/Evangelion/NERV.png" alt="NERV"></abbr>
        </div>
        <div class="options">
            <img src="../Imagens/PNG/Evangelion/Home.png" alt="Home" id="home" class="glow" onclick="home(this)">
            <img src="../Imagens/PNG/Evangelion/About.png" alt="About" id="about" class="glow" onclick="move(this)">
            <img src="../Imagens/PNG/Evangelion/Socials.png" alt="Socials" id="socials" class="glow" onclick="move(this)">
            <img src="../Imagens/PNG/Evangelion/Projects.png" alt="Projects" id="projects" class="glow" onclick="move(this)">
        </div>
    </div>
    <div class="options-back"> <!----------------------------------------------------------Options-------------------------------------------------->
        <p class="glow text" id="home2" onclick="moveback(this)">Home</p>
        <p class="glow text" id="about2" onclick="moveback(this)">About</p>
        <p class="glow text" id="socials2" onclick="moveback(this)">Socials</p>
        <p class="glow text" id="projects2" onclick="moveback(this)">Projects</p>
    </div>
    <div class="screen">
        <div class="screen" id="screen-about"><!-----------------------------------------About------------------------------------------------------>
            <p class="text">This website serves as a hub for B2's social media and projects. Make yourself at home while you're here.</p>
        </div>
            <div class="screen" id="screen-socials">
                <abbr title="Alyss (Pandora Hearts)"><a href="https://passportdex.com/realb2" target="_blank" rel="nofollow"><img class="social" id="passportdex" src="../Imagens/PNG/Evangelion/Socials/Passportdex.png" alt="Passportdex"></a></abbr>

                <abbr title="Shinobu (Monogatari Series)"><a href="http://steamcommunity.com/id/lB2a" target="_blank" rel="nofollow"><img class="social" id="steam" src="../Imagens/PNG/Evangelion/Socials/Steam.png" alt="Steam"></a></abbr>

                <abbr title="Kiriko (Overwatch)"><a href="https://on.soundcloud.com/oTgFMdbc5YMnaQxjdI" target="_blank" rel="nofollow"><img class="social" id="soundcloud" src="../Imagens/PNG/Evangelion/Socials/Soundcloud.png" alt="Soundcloud"></a></abbr>

                <abbr title="Juno (Overwatch)"><a href="https://br.pinterest.com/dontB2close/" target="_blank" rel="nofollow"><img class="social" id="pinterest" src="../Imagens/PNG/Evangelion/Socials/Pinterest.png" alt="Pinterest"></a></abbr>
            </div>
        </div>
    <script src="../JS/Evangelion.js"></script>
</body>
</html>
